{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $width := .Get "width" -}}
{{- $style := .Get "style" -}}
{{- $class := .Get "class" -}}

{{- $url := $src -}}
{{- if not (urls.Parse $src).Scheme -}}
  {{- $url = $src | relURL -}}
{{- end -}}

<img src="{{ $url }}"
     {{ with $alt }}alt="{{ . }}"{{ end }}
     {{ with $width }}width="{{ . }}"{{ end }}
     {{ with $style }}style="{{ . | safeCSS }}"{{ end }}
     {{ with $class }}class="{{ . }}"{{ end }} />
